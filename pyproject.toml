[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electric-city"
version = "1.0.0"
description = "A Python-powered 3D night drive through every Manhattan building."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydeck>=0.9.1,<1",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
